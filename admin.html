<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog Project - Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e8f1df;
    color: #29452c;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 35px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #607360;
    margin-bottom: 30px;
}

.card {
    background: #f7fbf3;
    border: 1px solid #c8ddbd;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(45,75,48,.08);
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #c8ddbd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 14px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #789b70;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #668c5f;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.invitation {
    border-top: 1px solid #d6e4cf;
    padding: 18px 0;
}

.invitation:first-child {
    border-top: none;
}

.email {
    font-weight: 600;
    word-break: break-word;
}

.status {
    color: #607360;
    font-size: 13px;
    margin: 7px 0 12px;
    font-weight: 600;
}

.invitation-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.invitation-actions button {
    width: auto;
    flex: 1;
    min-width: 150px;
}

.copy-button {
    background: #b5d0a8;
    color: #29452c;
}

.copy-button:hover {
    background: #a4c497;
}

.delete-button {
    background: #d9aaa4;
    color: #4b2724;
}

.delete-button:hover {
    background: #cc9790;
}

.logout {
    background: #d2e3c7;
    color: #29452c;
}

.logout:hover {
    background: #c2d7b6;
}

.login-button {
    margin-top: 15px;
}

.hidden {
    display: none;
}

.loading {
    text-align: center;
    color: #607360;
    padding: 15px 0;
}

.valid {
    color: #4d7c45;
}

.pending {
    color: #8a7650;
}

.error {
    color: #a34d45;
}

.success {
    color: #4d7c45;
}

.account-info {
    font-size: 12px;
    color: #71806f;
    margin-top: 4px;
    word-break: break-word;
}

.empty {
    text-align: center;
    color: #71806f;
    padding: 15px 0;
}

</style>
</head>

<body>

<div class="container">

    <h1>Dog Project</h1>

    <div class="subtitle">
        Admin
    </div>


    <!-- NOT SIGNED IN -->

    <div id="notSignedIn" class="card hidden">

        <h2>Sign in required</h2>

        <p>
            Please sign in with the administrator account.
        </p>

        <button
            id="goToLoginButton"
            class="login-button"
        >
            Go to sign in
        </button>

    </div>


    <!-- ACCESS DENIED -->

    <div id="accessDenied" class="card hidden">

        <h2>Access denied</h2>

        <p>
            This account does not have administrator access.
        </p>

        <button
            id="accessDeniedLogoutButton"
            class="logout"
        >
            Sign out
        </button>

    </div>


    <!-- ADMIN AREA -->

    <div id="adminArea" class="hidden">


        <!-- CREATE INVITATION -->

        <div class="card">

            <h2>Invite a person</h2>

            <p>
                Create a private invitation link and send it by email.
            </p>

            <label for="inviteEmail">
                Email address
            </label>

            <input
                type="email"
                id="inviteEmail"
                placeholder="person@example.com"
            >

            <button
                id="inviteButton"
            >
                Create invitation
            </button>

            <div
                id="inviteMessage"
                class="message"
            ></div>

        </div>


        <!-- INVITATIONS -->

        <div class="card">

            <h2>Invitations</h2>

            <div id="invitations">
                <div class="loading">
                    Loading...
                </div>
            </div>

        </div>


        <!-- LOGOUT -->

        <button
            id="logoutButton"
            class="logout"
        >
            Sign out
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    deleteDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyD9ZgCzDDqdPUtmGSwyPOBY_xW_xTzCNz_M",

    authDomain: "dog-project-87499.firebaseapp.com",

    projectId: "dog-project-87499",

    storageBucket: "dog-project-87499.firebasestorage.app",

    messagingSenderId: "998278019104",

    appId: "1:998278019104:web:8cd4020aa95e012a6ea445"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



/* =========================================================
   ELEMENTS
========================================================= */

const adminArea =
    document.getElementById("adminArea");

const accessDenied =
    document.getElementById("accessDenied");

const notSignedIn =
    document.getElementById("notSignedIn");

const inviteEmail =
    document.getElementById("inviteEmail");

const inviteButton =
    document.getElementById("inviteButton");

const inviteMessage =
    document.getElementById("inviteMessage");

const invitations =
    document.getElementById("invitations");

const logoutButton =
    document.getElementById("logoutButton");

const accessDeniedLogoutButton =
    document.getElementById("accessDeniedLogoutButton");

const goToLoginButton =
    document.getElementById("goToLoginButton");



/* =========================================================
   CREATE RANDOM INVITATION TOKEN
========================================================= */

function createToken() {

    const array =
        new Uint8Array(32);

    crypto.getRandomValues(array);

    return Array
        .from(array)
        .map(byte =>
            byte
                .toString(16)
                .padStart(2, "0")
        )
        .join("");

}



/* =========================================================
   SHOW / HIDE AREAS
========================================================= */

function hideAllAreas() {

    adminArea.classList.add("hidden");

    accessDenied.classList.add("hidden");

    notSignedIn.classList.add("hidden");

}


function showNotSignedIn() {

    hideAllAreas();

    notSignedIn.classList.remove("hidden");

}


function showAccessDenied() {

    hideAllAreas();

    accessDenied.classList.remove("hidden");

}


function showAdminArea() {

    hideAllAreas();

    adminArea.classList.remove("hidden");

}



/* =========================================================
   CHECK WHETHER A USER ACCOUNT EXISTS
========================================================= */

async function findUserByEmail(email) {

    if (!email) {
        return null;
    }

    try {

        const normalizedEmail =
            email.trim().toLowerCase();

        const userQuery =
            query(
                collection(db, "users"),
                where(
                    "email",
                    "==",
                    normalizedEmail
                )
            );

        const snapshot =
            await getDocs(userQuery);

        if (snapshot.empty) {

            return null;

        }

        const first =
            snapshot.docs[0];

        return {

            id: first.id,

            data: first.data()

        };

    } catch (error) {

        console.error(
            "USER LOOKUP ERROR:",
            error
        );

        return null;
    }

}



/* =========================================================
   LOAD INVITATIONS
========================================================= */

async function loadInvitations() {

    invitations.innerHTML =
        '<div class="loading">Loading...</div>';


    try {

        const invitationQuery =
            query(
                collection(db, "invitations"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                invitationQuery
            );


        if (snapshot.empty) {

            invitations.innerHTML =
                '<div class="empty">No invitations yet.</div>';

            return;

        }


        invitations.innerHTML = "";


        for (const item of snapshot.docs) {

            const data =
                item.data();


            const wrapper =
                document.createElement("div");

            wrapper.className =
                "invitation";


            /* EMAIL */

            const email =
                document.createElement("div");

            email.className =
                "email";

            email.textContent =
                data.email || "";



            /* FIND ACCOUNT */

            const user =
                await findUserByEmail(
                    data.email || ""
                );


            const hasValidAccount =
                user !== null;



            /* STATUS */

            const status =
                document.createElement("div");

            status.className =
                "status";


            if (hasValidAccount) {

                status.textContent =
                    "Valid account";

                status.classList.add(
                    "valid"
                );

            } else if (
                data.status === "Accepted"
            ) {

                status.textContent =
                    "Accepted";

                status.classList.add(
                    "valid"
                );

            } else {

                status.textContent =
                    data.status ||
                    "Pending";

                status.classList.add(
                    "pending"
                );

            }



            /* ACCOUNT INFO */

            if (hasValidAccount) {

                const accountInfo =
                    document.createElement("div");

                accountInfo.className =
                    "account-info";

                accountInfo.textContent =
                    "Account created";

                wrapper.appendChild(
                    email
                );

                wrapper.appendChild(
                    status
                );

                wrapper.appendChild(
                    accountInfo
                );

            } else {

                wrapper.appendChild(
                    email
                );

                wrapper.appendChild(
                    status
                );

            }



            /* ACTIONS */

            const actions =
                document.createElement("div");

            actions.className =
                "invitation-actions";



            /* COPY BUTTON */

            const copyButton =
                document.createElement("button");

            copyButton.className =
                "copy-button";

            copyButton.textContent =
                "Copy invitation link";


            const link =
                window.location.origin +

                window.location.pathname
                    .replace(
                        "admin.html",
                        "invite.html"
                    ) +

                "?token=" +

                (data.token || "");


            copyButton.addEventListener(
                "click",
                async () => {

                    try {

                        await navigator.clipboard
                            .writeText(link);

                        copyButton.textContent =
                            "Copied";

                        setTimeout(() => {

                            copyButton.textContent =
                                "Copy invitation link";

                        }, 2000);

                    } catch (error) {

                        console.error(
                            "COPY ERROR:",
                            error
                        );

                        window.prompt(
                            "Copy this invitation link:",
                            link
                        );

                    }

                }
            );



            /* DELETE BUTTON */

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                async () => {

                    const confirmed =
                        window.confirm(

                            "Are you sure you want to delete this invitation for " +

                            (
                                data.email ||
                                "this email address"
                            ) +

                            "?"

                        );


                    if (!confirmed) {

                        return;

                    }


                    deleteButton.disabled =
                        true;

                    deleteButton.textContent =
                        "Deleting...";


                    try {

                        await deleteDoc(

                            doc(
                                db,
                                "invitations",
                                item.id
                            )

                        );


                        wrapper.remove();


                    } catch (error) {

                        console.error(
                            "DELETE INVITATION ERROR:",
                            error
                        );


                        deleteButton.disabled =
                            false;

                        deleteButton.textContent =
                            "Delete";


                        alert(
                            "Unable to delete this invitation."
                        );

                    }

                }
            );



            actions.appendChild(
                copyButton
            );

            actions.appendChild(
                deleteButton
            );


            wrapper.appendChild(
                actions
            );


            invitations.appendChild(
                wrapper
            );

        }


    } catch (error) {

        console.error(
            "LOAD INVITATIONS ERROR:",
            error
        );


        invitations.innerHTML =
            '<div class="error">Unable to load invitations.</div>';

    }

}



/* =========================================================
   CREATE INVITATION
========================================================= */

inviteButton.addEventListener(
    "click",
    async () => {

        const email =
            inviteEmail.value
                .trim()
                .toLowerCase();


        if (!email) {

            inviteMessage.textContent =
                "Please enter an email address.";

            inviteMessage.className =
                "message error";

            return;

        }


        if (
            !email.includes("@") ||
            !email.includes(".")
        ) {

            inviteMessage.textContent =
                "Please enter a valid email address.";

            inviteMessage.className =
                "message error";

            return;

        }


        const currentUser =
            auth.currentUser;


        if (!currentUser) {

            inviteMessage.textContent =
                "You are not signed in.";

            inviteMessage.className =
                "message error";

            return;

        }


        inviteButton.disabled =
            true;

        inviteMessage.textContent =
            "Creating invitation...";

        inviteMessage.className =
            "message";



        try {

            const token =
                createToken();


            const link =
                window.location.origin +

                window.location.pathname
                    .replace(
                        "admin.html",
                        "invite.html"
                    ) +

                "?token=" +

                token;



            /* CREATE FIRESTORE INVITATION */

            await addDoc(

                collection(
                    db,
                    "invitations"
                ),

                {

                    email: email,

                    token: token,

                    status: "Pending",

                    createdAt: serverTimestamp(),

                    createdBy:
                        currentUser.uid

                }

            );



            /* SUCCESS MESSAGE */

            inviteMessage.textContent =
                "Invitation created successfully.";

            inviteMessage.className =
                "message success";


            inviteEmail.value = "";


            await loadInvitations();



            /* OPEN EMAIL CLIENT */

            const subject =
                encodeURIComponent(
                    "You're invited to Dog Project"
                );


            const body =
                encodeURIComponent(

`Hello,

You have been invited to join Dog Project.

Please use the link below to accept your invitation:

${link}

This invitation is intended for ${email}.

Dog Project`

                );


            window.location.href =
                "mailto:" +

                encodeURIComponent(email) +

                "?subject=" +

                subject +

                "&body=" +

                body;



        } catch (error) {

            console.error(
                "CREATE INVITATION ERROR:",
                error
            );


            inviteMessage.textContent =
                "Unable to create invitation.";

            inviteMessage.className =
                "message error";


        } finally {

            inviteButton.disabled =
                false;

        }

    }
);



/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {

        await signOut(auth);

        hideAllAreas();

        showNotSignedIn();

    } catch (error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );

    }

}


logoutButton.addEventListener(
    "click",
    logout
);


accessDeniedLogoutButton.addEventListener(
    "click",
    logout
);



/* =========================================================
   GO TO LOGIN
========================================================= */

goToLoginButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";

    }
);



/* =========================================================
   AUTH STATE
========================================================= */

/*
   IMPORTANT:
   We DO NOT redirect to index.html when Firebase
   reports no user.

   This prevents the redirect/flickering loop.
*/

onAuthStateChanged(
    auth,
    async (user) => {

        console.log(
            "AUTH STATE:",
            user
        );


        if (!user) {

            showNotSignedIn();

            return;

        }


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnapshot =
                await getDoc(
                    userRef
                );


            if (
                !userSnapshot.exists()
            ) {

                console.error(
                    "USER DOCUMENT DOES NOT EXIST"
                );

                showAccessDenied();

                return;

            }


            const userData =
                userSnapshot.data();


            console.log(
                "CURRENT USER DATA:",
                userData
            );


            if (
                userData.role !== "admin"
            ) {

                showAccessDenied();

                return;

            }


            showAdminArea();


            await loadInvitations();


        } catch (error) {

            console.error(
                "ADMIN AUTH ERROR:",
                error
            );


            showAccessDenied();

        }

    }
);

</script>

</body>
</html>
