<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog Project - Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e8f1df;
    color: #29452c;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 35px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #607360;
    margin-bottom: 30px;
}

.card {
    background: #f7fbf3;
    border: 1px solid #c8ddbd;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(45,75,48,.08);
}

.card h2 {
    margin-top: 0;
}

.card p {
    color: #607360;
    line-height: 1.5;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #c8ddbd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 14px;
    background: white;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #789b70;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #668c5f;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    min-height: 20px;
}

.error {
    color: #a34d45;
}

.success {
    color: #4f7b48;
}

.hidden {
    display: none !important;
}


/* LOGIN */

.login-box {
    max-width: 430px;
    margin: 0 auto;
}


/* INVITATIONS */

.invitation {
    border-top: 1px solid #d6e4cf;
    padding: 18px 0;
}

.invitation:first-child {
    border-top: none;
}

.email {
    font-weight: 600;
    word-break: break-word;
}

.status {
    color: #607360;
    font-size: 13px;
    margin: 6px 0 12px;
    font-weight: 600;
}

.status.valid {
    color: #4f7b48;
}

.status.pending {
    color: #8a7650;
}

.invitation-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.invitation-actions button {
    width: auto;
    flex: 1;
    min-width: 150px;
}

.copy-button {
    background: #b5d0a8;
    color: #29452c;
}

.delete-button {
    background: #d9aaa4;
    color: #4b2724;
}

.logout {
    background: #d2e3c7;
    color: #29452c;
}

.empty {
    text-align: center;
    color: #607360;
    padding: 15px 0;
}

</style>
</head>


<body>

<div class="container">

    <h1>Dog Project</h1>

    <div class="subtitle">
        Admin
    </div>


    <!-- LOGIN -->

    <div
        id="loginArea"
        class="card login-box"
    >

        <h2>Admin sign in</h2>

        <p>
            Sign in with the administrator account.
        </p>


        <label for="loginEmail">
            Email address
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email address"
            autocomplete="email"
        >


        <label for="loginPassword">
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
        >
            Sign in
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>



    <!-- ACCESS DENIED -->

    <div
        id="accessDenied"
        class="card hidden"
    >

        <h2>Access denied</h2>

        <p>
            This account is signed in, but it does not have administrator access.
        </p>


        <button
            id="deniedLogoutButton"
            class="logout"
        >
            Sign out
        </button>

    </div>



    <!-- ADMIN AREA -->

    <div
        id="adminArea"
        class="hidden"
    >


        <!-- CREATE INVITATION -->

        <div class="card">

            <h2>Invite a person</h2>

            <p>
                Create a private invitation link and send it by email.
            </p>


            <label for="inviteEmail">
                Email address
            </label>


            <input
                type="email"
                id="inviteEmail"
                placeholder="person@example.com"
                autocomplete="email"
            >


            <button
                id="inviteButton"
            >
                Create invitation
            </button>


            <div
                id="inviteMessage"
                class="message"
            ></div>

        </div>



        <!-- INVITATIONS -->

        <div class="card">

            <h2>Invitations</h2>


            <div id="invitations">
                Loading...
            </div>

        </div>



        <!-- SIGN OUT -->

        <button
            id="logoutButton"
            class="logout"
        >
            Sign out
        </button>


    </div>

</div>



<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIGURATION
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyD9ZgCzDDqdPUtmGSwyPOBYx_WxTzCNz_M",

    authDomain:
        "dog-project-87499.firebaseapp.com",

    projectId:
        "dog-project-87499",

    storageBucket:
        "dog-project-87499.firebasestorage.app",

    messagingSenderId:
        "998278019104",

    appId:
        "1:998278019104:web:8cd4020aa95e012a6ea445"

};



/* =====================================================
   INITIALISE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   ELEMENTS
===================================================== */

const loginArea =
    document.getElementById("loginArea");


const loginEmail =
    document.getElementById("loginEmail");


const loginPassword =
    document.getElementById("loginPassword");


const loginButton =
    document.getElementById("loginButton");


const loginMessage =
    document.getElementById("loginMessage");


const accessDenied =
    document.getElementById("accessDenied");


const adminArea =
    document.getElementById("adminArea");


const deniedLogoutButton =
    document.getElementById("deniedLogoutButton");


const inviteEmail =
    document.getElementById("inviteEmail");


const inviteButton =
    document.getElementById("inviteButton");


const inviteMessage =
    document.getElementById("inviteMessage");


const invitations =
    document.getElementById("invitations");


const logoutButton =
    document.getElementById("logoutButton");



/* =====================================================
   UI
===================================================== */

function hideAll() {

    loginArea.classList.add("hidden");

    accessDenied.classList.add("hidden");

    adminArea.classList.add("hidden");

}


function showLogin() {

    hideAll();

    loginArea.classList.remove("hidden");

}


function showDenied() {

    hideAll();

    accessDenied.classList.remove("hidden");

}


function showAdmin() {

    hideAll();

    adminArea.classList.remove("hidden");

}



/* =====================================================
   TOKEN
===================================================== */

function createToken() {

    const array =
        new Uint8Array(32);


    crypto.getRandomValues(array);


    return Array
        .from(array)
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");

}



/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    async () => {


        const email =
            loginEmail.value
                .trim()
                .toLowerCase();


        const password =
            loginPassword.value;


        loginMessage.textContent =
            "";


        if (!email || !password) {

            loginMessage.textContent =
                "Please enter your email and password.";

            loginMessage.className =
                "message error";

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Signing in...";


        try {


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            loginMessage.textContent =
                "Signed in successfully.";

            loginMessage.className =
                "message success";


        } catch (error) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            loginMessage.textContent =
                "Unable to sign in: " +
                error.code;

            loginMessage.className =
                "message error";


        } finally {


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Sign in";

        }

    }
);



/* =====================================================
   LOGIN WITH ENTER
===================================================== */

loginPassword.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            loginButton.click();

        }

    }
);



/* =====================================================
   FIND USER ACCOUNT BY EMAIL
===================================================== */

async function findUserByEmail(
    email
) {


    if (!email) {

        return null;

    }


    try {


        const normalizedEmail =
            email
                .trim()
                .toLowerCase();


        const userQuery =
            query(
                collection(
                    db,
                    "users"
                ),
                where(
                    "email",
                    "==",
                    normalizedEmail
                )
            );


        const snapshot =
            await getDocs(
                userQuery
            );


        if (
            snapshot.empty
        ) {

            return null;

        }


        return snapshot.docs[0];


    } catch (error) {


        console.error(
            "FIND USER ERROR:",
            error
        );


        return null;

    }

}



/* =====================================================
   LOAD INVITATIONS
===================================================== */

async function loadInvitations() {


    invitations.innerHTML =
        "Loading...";


    try {


        const invitationQuery =
            query(
                collection(
                    db,
                    "invitations"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                invitationQuery
            );


        if (
            snapshot.empty
        ) {


            invitations.innerHTML =
                '<div class="empty">No invitations yet.</div>';


            return;

        }


        invitations.innerHTML =
            "";


        for (
            const item
            of snapshot.docs
        ) {


            const data =
                item.data();


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "invitation";



            /* EMAIL */

            const email =
                document.createElement(
                    "div"
                );


            email.className =
                "email";


            email.textContent =
                data.email || "";



            /* CHECK ACCOUNT */

            const user =
                await findUserByEmail(
                    data.email || ""
                );


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "status";


            if (
    data.status === "Active"
) {

    status.textContent =
        "Active";

    status.classList.add(
        "valid"
    );

} else {

    status.textContent =
        "Pending";

    status.classList.add(
        "pending"
    );

}



            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "invitation-actions";



            /* COPY */

            const copyButton =
                document.createElement(
                    "button"
                );


            copyButton.className =
                "copy-button";


            copyButton.textContent =
                "Copy invitation link";


            const link =
                window.location.origin +

                window.location.pathname
                    .replace(
                        "admin.html",
                        "invite.html"
                    ) +

                "?token=" +

                (
                    data.token ||
                    ""
                );


            copyButton.addEventListener(
                "click",
                async () => {


                    try {


                        await navigator.clipboard
                            .writeText(
                                link
                            );


                        copyButton.textContent =
                            "Copied";


                        setTimeout(
                            () => {

                                copyButton.textContent =
                                    "Copy invitation link";

                            },
                            2000
                        );


                    } catch (error) {


                        window.prompt(
                            "Copy this invitation link:",
                            link
                        );

                    }

                }
            );



            /* DELETE */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete-button";


            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                async () => {


                    const confirmed =
                        window.confirm(

                            "Are you sure you want to delete the invitation for " +

                            (
                                data.email ||
                                "this email"
                            ) +

                            "?"

                        );


                    if (!confirmed) {

                        return;

                    }


                    deleteButton.disabled =
                        true;


                    deleteButton.textContent =
                        "Deleting...";


                    try {


                        await deleteDoc(
                            doc(
                                db,
                                "invitations",
                                item.id
                            )
                        );


                        wrapper.remove();


                    } catch (error) {


                        console.error(
                            "DELETE ERROR:",
                            error
                        );


                        deleteButton.disabled =
                            false;


                        deleteButton.textContent =
                            "Delete";


                        alert(
                            "Unable to delete this invitation."
                        );

                    }

                }
            );



            actions.appendChild(
                copyButton
            );


            actions.appendChild(
                deleteButton
            );


            wrapper.appendChild(
                email
            );


            wrapper.appendChild(
                status
            );


            wrapper.appendChild(
                actions
            );


            invitations.appendChild(
                wrapper
            );

        }


    } catch (error) {


        console.error(
            "LOAD INVITATIONS ERROR:",
            error
        );


        invitations.innerHTML =
            '<div class="message error">Unable to load invitations.</div>';

    }

}



/* =====================================================
   CREATE INVITATION
===================================================== */

inviteButton.addEventListener(
    "click",
    async () => {


        const email =
            inviteEmail.value
                .trim()
                .toLowerCase();


        if (!email) {


            inviteMessage.textContent =
                "Please enter an email address.";


            inviteMessage.className =
                "message error";


            return;

        }


        const currentUser =
            auth.currentUser;


        if (!currentUser) {


            inviteMessage.textContent =
                "You are not signed in.";


            inviteMessage.className =
                "message error";


            return;

        }


        inviteButton.disabled =
            true;


        inviteMessage.textContent =
            "Creating invitation...";


        inviteMessage.className =
            "message";


        try {


            const token =
                createToken();


            const link =
                window.location.origin +

                window.location.pathname
                    .replace(
                        "admin.html",
                        "invite.html"
                    ) +

                "?token=" +

                token;



            await addDoc(
                collection(
                    db,
                    "invitations"
                ),
                {

                    email:
                        email,

                    token:
                        token,

                    status:
                        "Pending",

                    createdAt:
                        Date.now(),

                    createdBy:
                        currentUser.uid

                }
            );



            inviteEmail.value =
                "";


            inviteMessage.textContent =
                "Invitation created successfully.";


            inviteMessage.className =
                "message success";


            await loadInvitations();



            /*
             * OPEN THE USER'S EMAIL CLIENT.
             * THIS DOES NOT SEND FROM ICLOUD/FIREBASE.
             */

            const subject =
                encodeURIComponent(
                    "You're invited to Dog Project"
                );


            const body =
                encodeURIComponent(

`Hello,

You have been invited to join Dog Project.

Please use the link below to accept your invitation:

${link}

This invitation is intended for ${email}.

Dog Project`

                );


            window.location.href =
                "mailto:" +

                encodeURIComponent(
                    email
                ) +

                "?subject=" +

                subject +

                "&body=" +

                body;


        } catch (error) {


            console.error(
                "CREATE INVITATION ERROR:",
                error
            );


            inviteMessage.textContent =
                "Unable to create invitation.";


            inviteMessage.className =
                "message error";


        } finally {


            inviteButton.disabled =
                false;

        }

    }
);



/* =====================================================
   SIGN OUT
===================================================== */

async function doSignOut() {


    try {


        await signOut(
            auth
        );


        loginEmail.value =
            "";


        loginPassword.value =
            "";


        loginMessage.textContent =
            "";


        window.location.href = "index.html";


    } catch (error) {


        console.error(
            "SIGN OUT ERROR:",
            error
        );

    }

}


logoutButton.addEventListener(
    "click",
    doSignOut
);


deniedLogoutButton.addEventListener(
    "click",
    doSignOut
);



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {


        /*
         * IMPORTANT:
         *
         * No redirect here.
         * The admin page itself handles login.
         *
         * This prevents the endless
         * index.html <-> admin.html loop.
         */


        if (!user) {


            showLogin();


            return;

        }



        try {


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnapshot =
                await getDoc(
                    userRef
                );


            if (
                !userSnapshot.exists()
            ) {


                showDenied();


                return;

            }


            const userData =
                userSnapshot.data();


            if (
                userData.role !== "admin"
            ) {


                showDenied();


                return;

            }



            /*
             * USER IS ADMIN
             */

            showAdmin();


            await loadInvitations();


        } catch (error) {


            console.error(
                "ADMIN CHECK ERROR:",
                error
            );


            showDenied();

        }

    }
);

</script>

</body>
</html>
