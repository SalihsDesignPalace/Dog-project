<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Dogs</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: #29452c;
    background: #e8f1df;
}


/* =========================================
   HEADER
   ========================================= */

.hero {
    position: relative;

    width: 100%;
    height: 420px;

    background-image:
        url("ChatGPT%20Image%20Aug%2029%2C%202026%20at%2001_14_28%20PM.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================================
   SIGN OUT
   ========================================= */

.sign-out-button {
    position: absolute;

    top: 22px;
    right: 24px;

    padding: 10px 18px;

    border: 1px solid rgba(255,255,255,0.75);

    border-radius: 24px;

    background: rgba(232,241,223,0.82);

    color: #29452c;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 4px 14px rgba(30,60,35,0.18);

    backdrop-filter: blur(5px);
}

.sign-out-button:hover {
    background: rgba(245,249,239,0.96);
}


/* =========================================
   MENU
   ========================================= */

.main-nav {
    width: 100%;

    padding: 22px 20px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 16px;

    flex-wrap: wrap;
}

.menu-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 125px;

    padding: 13px 24px;

    border-radius: 30px;

    border: 1px solid rgba(55,91,58,0.18);

    text-decoration: none;

    color: #29452c;

    font-size: 15px;
    font-weight: 600;

    background: #c7dcb9;

    box-shadow:
        0 4px 12px rgba(45,75,48,0.10);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.dog-button {
    background: #b5d0a8;
}

.about-button {
    background: #d2e3c7;
}

.menu-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 16px rgba(45,75,48,0.16);
}


/* =========================================
   MAIN
   ========================================= */

.dog-area {
    width: calc(100% - 56px);

    max-width: 1200px;

    margin: 0 auto 40px;

    padding: 45px 30px 55px;

    background: #dcebd3;

    border-radius: 28px;

    box-shadow:
        0 8px 28px rgba(45,75,48,0.10);
}


/* =========================================
   TITLE
   ========================================= */

.page-title {
    margin: 0;

    text-align: center;

    font-size: 34px;

    color: #29452c;
}

.page-subtitle {
    margin: 10px auto 35px;

    max-width: 650px;

    text-align: center;

    color: #58705b;

    font-size: 16px;

    line-height: 1.5;
}


/* =========================================
   ADD DOG
   ========================================= */

.add-dog-button {
    display: block;

    margin: 0 auto 35px;

    min-width: 230px;

    padding: 16px 30px;

    border: none;

    border-radius: 24px;

    background: #7fa66f;

    color: white;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 6px 16px rgba(45,75,48,0.18);
}

.add-dog-button:hover {
    background: #6f9761;
}


/* =========================================
   ADD FORM
   ========================================= */

.add-dog-form {
    display: none;

    max-width: 650px;

    margin: 0 auto 35px;

    padding: 30px;

    background:
        rgba(255,255,255,0.68);

    border-radius: 22px;

    border:
        1px solid
        rgba(55,91,58,0.12);
}

.form-title {
    margin: 0 0 22px;

    text-align: center;

    font-size: 23px;
}

.form-label {
    display: block;

    margin-bottom: 8px;

    font-size: 15px;

    font-weight: 600;
}

.dog-name-input {
    width: 100%;

    padding: 14px 16px;

    border:
        1px solid
        #b8cdb0;

    border-radius: 14px;

    background: white;

    color: #29452c;

    font-size: 16px;

    outline: none;
}

.dog-name-input:focus {
    border-color: #7fa66f;

    box-shadow:
        0 0 0 3px
        rgba(127,166,111,0.15);
}


/* =========================================
   AVATAR CHOOSER
   ========================================= */

.avatar-title {
    margin-top: 22px;
    margin-bottom: 12px;

    font-size: 15px;

    font-weight: 600;
}

.avatar-grid {
    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 10px;
}

.avatar-option {
    aspect-ratio: 1 / 1;

    border: 2px solid transparent;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 31px;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;
}

.avatar-option:hover {
    transform: scale(1.06);
}

.avatar-option.selected {
    border-color: #52794d;

    box-shadow:
        0 0 0 3px
        rgba(82,121,77,0.18);
}

.avatar-one {
    background: #d7e8ca;
}

.avatar-two {
    background: #e7d7bd;
}

.avatar-three {
    background: #c8dbe5;
}

.avatar-four {
    background: #e8caca;
}

.avatar-five {
    background: #ddd0e5;
}

.avatar-six {
    background: #d9dfb9;
}

.avatar-seven {
    background: #e6d4b8;
}

.avatar-eight {
    background: #c9dfd0;
}

.avatar-nine {
    background: #d8d2c4;
}

.avatar-ten {
    background: #d5dce8;
}


/* =========================================
   FORM BUTTONS
   ========================================= */

.form-buttons {
    display: flex;

    gap: 12px;

    margin-top: 25px;
}

.save-dog-button,
.cancel-dog-button {
    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 16px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}

.save-dog-button {
    background: #7fa66f;

    color: white;
}

.cancel-dog-button {
    background: #d2dfcc;

    color: #4f6651;
}


/* =========================================
   DOG LIST
   ========================================= */

.dog-list {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px,1fr)
        );

    gap: 22px;
}


/* =========================================
   DOG CARD
   ========================================= */

.dog-card {
    padding: 28px 22px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    background:
        rgba(255,255,255,0.72);

    border-radius: 24px;

    border:
        1px solid
        rgba(55,91,58,0.12);

    box-shadow:
        0 5px 15px
        rgba(45,75,48,0.08);
}


/* =========================================
   DOG IMAGE
   ========================================= */

.dog-avatar {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 16px;

    background: #d7e8ca;

    font-size: 52px;

    overflow: hidden;
}

.dog-avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    pointer-events: none;
}


/* =========================================
   DOG NAME
   ========================================= */

.dog-name {
    margin: 0;

    font-size: 21px;

    font-weight: 700;
}

.dog-number {
    margin-top: 6px;

    font-size: 13px;

    color: #718473;
}


/* =========================================
   EDIT
   ========================================= */

.edit-dog-button {
    margin-top: 18px;

    padding: 10px 25px;

    border:
        1px solid
        #9fba96;

    border-radius: 18px;

    background: #e6f0e1;

    color: #456747;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;
}

.edit-dog-button:hover {
    background: #d8e9d2;
}


/* =========================================
   EDIT PANEL
   ========================================= */

.edit-panel {
    display: none;

    width: 100%;

    margin-top: 20px;

    padding-top: 20px;

    border-top:
        1px solid
        #cbdac5;
}

.edit-title {
    margin: 0 0 16px;

    font-size: 16px;

    color: #456747;
}


/* =========================================
   ACTION BUTTONS
   ========================================= */

.edit-action {
    width: 100%;

    margin-top: 10px;

    padding: 11px 15px;

    border-radius: 14px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;
}

.upload-photo-button {
    border:
        1px solid
        #9fba96;

    background: #edf5ea;

    color: #456747;
}

.delete-photo-button {
    border:
        1px solid
        #b8cdb0;

    background: #f1f5ee;

    color: #527052;
}

.delete-dog-button {
    margin-top: 16px;

    border:
        1px solid
        #d8aaa5;

    background: #f4dfdc;

    color: #8a514b;
}

.delete-dog-button:hover {
    background: #efd3cf;
}

.hidden-file-input {
    display: none;
}


/* =========================================
   STATUS
   ========================================= */

.status-message {
    display: none;

    max-width: 600px;

    margin: 0 auto 25px;

    padding: 13px;

    border-radius: 14px;

    text-align: center;

    font-size: 14px;
}

.status-success {
    background: #d4e7ce;

    color: #456747;
}

.status-error {
    background: #f3ddda;

    color: #8a514b;
}


/* =========================================
   MAXIMUM
   ========================================= */

.max-message {
    display: none;

    margin-top: 25px;

    padding: 14px;

    text-align: center;

    border-radius: 14px;

    background: #cbdcbe;

    color: #4d654f;

    font-size: 14px;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width:700px) {

    .hero {
        height: 280px;
    }

    .sign-out-button {
        top: 14px;
        right: 14px;

        padding: 8px 14px;

        font-size: 13px;
    }

    .main-nav {
        padding: 16px 12px;

        gap: 8px;
    }

    .menu-button {
        min-width: 0;

        flex: 1;

        padding: 12px 8px;

        font-size: 14px;
    }

    .dog-area {
        width:
            calc(100% - 24px);

        padding:
            32px
            18px
            45px;

        border-radius: 22px;
    }

    .page-title {
        font-size: 28px;
    }

    .form-buttons {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<header class="hero">

    <button
        id="signOutButton"
        class="sign-out-button"
        type="button"
    >
        Sign Out
    </button>

</header>


<nav class="main-nav">

    <a
        href="desktop.html"
        class="menu-button"
    >
        Home
    </a>


    <a
        href="mydog.html"
        class="menu-button dog-button"
    >
        My Dog
    </a>


    <a
        href="#"
        class="menu-button about-button"
    >
        About
    </a>


    <a
        href="admin.html"
        id="adminButton"
        class="menu-button about-button"
        style="display:none;"
    >
        Admin
    </a>

</nav>


<main class="dog-area">


    <h1 class="page-title">
        My Dogs
    </h1>


    <p class="page-subtitle">
        Add your dogs and give each one their own little profile.
    </p>


    <button
        id="addDogButton"
        class="add-dog-button"
        type="button"
    >
        + Add Dog
    </button>


    <div
        id="addDogForm"
        class="add-dog-form"
    >

        <h2 class="form-title">
            Add Your Dog
        </h2>


        <label
            class="form-label"
            for="dogName"
        >
            Dog's name
        </label>


        <input
            id="dogName"
            class="dog-name-input"
            type="text"
            maxlength="40"
            placeholder="Enter your dog's name"
        >


        <div class="avatar-title">
            Choose an avatar
        </div>


        <div
            id="avatarGrid"
            class="avatar-grid"
        ></div>


        <div class="form-buttons">

            <button
                id="saveDogButton"
                class="save-dog-button"
                type="button"
            >
                Save Dog
            </button>


            <button
                id="cancelDogButton"
                class="cancel-dog-button"
                type="button"
            >
                Cancel
            </button>

        </div>

    </div>


    <div
        id="statusMessage"
        class="status-message"
    ></div>


    <div
        id="dogList"
        class="dog-list"
    ></div>


    <div
        id="maxMessage"
        class="max-message"
    >
        You can add up to 5 dogs.
    </div>


</main>


<script type="module">


/* =========================================
   FIREBASE IMPORTS
   ========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================================
   FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD9ZgCzDDqdPUtmGSwyPOBY_xWTxzCNz_M",

    authDomain:
        "dog-project-87499.firebaseapp.com",

    projectId:
        "dog-project-87499",

    storageBucket:
        "dog-project-87499.firebasestorage.app",

    messagingSenderId:
        "998278019104",

    appId:
        "1:998278019104:web:8cd4020aa95e012a6ea445"

};


/* =========================================
   FIREBASE
   ========================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const storage =
    getStorage(app);


/* =========================================
   ELEMENTS
   ========================================= */

const addDogButton =
    document.getElementById(
        "addDogButton"
    );


const addDogForm =
    document.getElementById(
        "addDogForm"
    );


const dogName =
    document.getElementById(
        "dogName"
    );


const saveDogButton =
    document.getElementById(
        "saveDogButton"
    );


const cancelDogButton =
    document.getElementById(
        "cancelDogButton"
    );


const dogList =
    document.getElementById(
        "dogList"
    );


const maxMessage =
    document.getElementById(
        "maxMessage"
    );


const adminButton =
    document.getElementById(
        "adminButton"
    );


const signOutButton =
    document.getElementById(
        "signOutButton"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const avatarGrid =
    document.getElementById(
        "avatarGrid"
    );


let currentUser = null;

let selectedAvatar = "🐶";


/* =========================================
   AVATARS
   ========================================= */

const avatars = [

    ["🐶", "avatar-one"],

    ["🐕", "avatar-two"],

    ["🦮", "avatar-three"],

    ["🐕‍🦺", "avatar-four"],

    ["🐩", "avatar-five"],

    ["🐺", "avatar-six"],

    ["🐕", "avatar-seven"],

    ["🐶", "avatar-eight"],

    ["🐩", "avatar-nine"],

    ["🦮", "avatar-ten"]

];


function buildAddAvatars() {

    avatarGrid.innerHTML = "";


    avatars.forEach(
        ([value, colour]) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "avatar-option " +
                colour;


            button.textContent =
                value;


            if (
                value === selectedAvatar
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.addEventListener(
                "click",
                () => {

                    selectedAvatar =
                        value;


                    avatarGrid
                        .querySelectorAll(
                            ".avatar-option"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );

                }
            );


            avatarGrid.appendChild(
                button
            );

        }
    );

}


buildAddAvatars();


/* =========================================
   STATUS
   ========================================= */

function showStatus(
    text,
    error = false
) {

    statusMessage.textContent =
        text;


    statusMessage.className =
        error
            ? "status-message status-error"
            : "status-message status-success";


    statusMessage.style.display =
        "block";


    setTimeout(
        () => {

            statusMessage.style.display =
                "none";

        },
        3500
    );

}


/* =========================================
   ADD DOG FORM
   ========================================= */

addDogButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            showStatus(
                "Please wait for your account to load.",
                true
            );

            return;

        }


        try {

            const dogsRef =
                collection(
                    db,
                    "users",
                    currentUser.uid,
                    "dogs"
                );


            const snapshot =
                await getDocs(
                    dogsRef
                );


            if (
                snapshot.size >= 5
            ) {

                maxMessage.style.display =
                    "block";

                return;

            }


            dogName.value =
                "";


            selectedAvatar =
                "🐶";


            buildAddAvatars();


            addDogForm.style.display =
                "block";


            dogName.focus();

        }
        catch (error) {

            console.error(
                "Add Dog form error:",
                error
            );


            showStatus(
                "Could not open Add Dog.",
                true
            );

        }

    }
);


/* =========================================
   CANCEL
   ========================================= */

cancelDogButton.addEventListener(
    "click",
    () => {

        dogName.value =
            "";

        selectedAvatar =
            "🐶";

        buildAddAvatars();

        addDogForm.style.display =
            "none";

    }
);


/* =========================================
   SAVE DOG
   ========================================= */

saveDogButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {
            return;
        }


        const name =
            dogName.value.trim();


        if (!name) {

            showStatus(
                "Please enter your dog's name.",
                true
            );

            dogName.focus();

            return;

        }


        saveDogButton.disabled =
            true;


        saveDogButton.textContent =
            "Saving...";


        try {

            const dogsRef =
                collection(
                    db,
                    "users",
                    currentUser.uid,
                    "dogs"
                );


            const snapshot =
                await getDocs(
                    dogsRef
                );


            if (
                snapshot.size >= 5
            ) {

                showStatus(
                    "You can add up to 5 dogs.",
                    true
                );

                return;

            }


            await addDoc(
                dogsRef,
                {
                    name:
                        name,

                    avatar:
                        selectedAvatar,

                    photoUrl:
                        "",

                    photoPath:
                        "",

                    createdAt:
                        serverTimestamp()
                }
            );


            dogName.value =
                "";


            addDogForm.style.display =
                "none";


            selectedAvatar =
                "🐶";


            buildAddAvatars();


            await loadDogs();


            showStatus(
                "Your dog has been added.",
                false
            );

        }
        catch (error) {

            console.error(
                "Save Dog error:",
                error
            );


            showStatus(
                "The dog could not be added.",
                true
            );

        }
        finally {

            saveDogButton.disabled =
                false;


            saveDogButton.textContent =
                "Save Dog";

        }

    }
);


/* =========================================
   LOAD DOGS
   ========================================= */

async function loadDogs() {

    if (!currentUser) {
        return;
    }


    dogList.innerHTML =
        "";


    const dogsRef =
        collection(
            db,
            "users",
            currentUser.uid,
            "dogs"
        );


    const snapshot =
        await getDocs(
            dogsRef
        );


    let dogs =
        snapshot.docs.map(
            document => ({
                document,
                data:
                    document.data()
            })
        );


    /*
     * Sort locally.
     *
     * This deliberately avoids Firestore
     * orderBy(), so old dogs without a
     * createdAt field cannot break the page.
     */

    dogs.sort(
        (a, b) => {

            const aTime =
                a.data.createdAt?.toMillis
                    ? a.data.createdAt.toMillis()
                    : 0;


            const bTime =
                b.data.createdAt?.toMillis
                    ? b.data.createdAt.toMillis()
                    : 0;


            return aTime - bTime;

        }
    );


    if (
        dogs.length >= 5
    ) {

        addDogButton.style.display =
            "none";

        maxMessage.style.display =
            "block";

    }
    else {

        addDogButton.style.display =
            "block";

        maxMessage.style.display =
            "none";

    }


    dogs.forEach(
        (item, index) => {

            renderDog(
                item.document,
                item.data,
                index
            );

        }
    );

}


/* =========================================
   RENDER DOG
   ========================================= */

function renderDog(
    dogDocument,
    dog,
    index
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "dog-card";


    card.dataset.dogId =
        dogDocument.id;


    /* AVATAR */

    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "dog-avatar";


    if (
        dog.photoUrl
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            dog.photoUrl;


        image.alt =
            "";


        avatar.appendChild(
            image
        );

    }
    else {

        avatar.textContent =
            dog.avatar || "🐶";

    }


    /* NAME */

    const name =
        document.createElement(
            "h3"
        );


    name.className =
        "dog-name";


    name.textContent =
        dog.name || "My Dog";


    /* NUMBER */

    const number =
        document.createElement(
            "div"
        );


    number.className =
        "dog-number";


    number.textContent =
        "Dog " + (index + 1);


    /* EDIT BUTTON */

    const editButton =
        document.createElement(
            "button"
        );


    editButton.type =
        "button";


    editButton.className =
        "edit-dog-button";


    editButton.textContent =
        "Edit";


    /* EDIT PANEL */

    const editPanel =
        document.createElement(
            "div"
        );


    editPanel.className =
        "edit-panel";


    const editTitle =
        document.createElement(
            "h4"
        );


    editTitle.className =
        "edit-title";


    editTitle.textContent =
        "Edit " +
        (dog.name || "Dog");


    editPanel.appendChild(
        editTitle
    );


    /* EDIT AVATARS */

    const editAvatarGrid =
        document.createElement(
            "div"
        );


    editAvatarGrid.className =
        "avatar-grid";


    avatars.forEach(
        ([value, colour]) => {

            const option =
                document.createElement(
                    "button"
                );


            option.type =
                "button";


            option.className =
                "avatar-option " +
                colour;


            option.textContent =
                value;


            if (
                !dog.photoUrl
                &&
                value === dog.avatar
            ) {

                option.classList.add(
                    "selected"
                );

            }


            option.addEventListener(
                "click",
                async () => {

                    await changeAvatar(
                        dogDocument.id,
                        value,
                        avatar,
                        editAvatarGrid
                    );

                }
            );


            editAvatarGrid.appendChild(
                option
            );

        }
    );


    editPanel.appendChild(
        editAvatarGrid
    );


    /* FILE INPUT */

    const fileInput =
        document.createElement(
            "input"
        );


    fileInput.type =
        "file";


    fileInput.accept =
        "image/*";


    fileInput.className =
        "hidden-file-input";


    /* UPLOAD */

    const uploadButton =
        document.createElement(
            "button"
        );


    uploadButton.type =
        "button";


    uploadButton.className =
        "edit-action upload-photo-button";


    uploadButton.textContent =
        "Upload New Photo";


    uploadButton.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        async () => {

            if (
                !fileInput.files
                ||
                !fileInput.files[0]
            ) {

                return;

            }


            await uploadDogPhoto(
                dogDocument.id,
                fileInput.files[0],
                avatar
            );


            fileInput.value =
                "";

        }
    );


    /* DELETE PHOTO */

    const deletePhotoButton =
        document.createElement(
            "button"
        );


    deletePhotoButton.type =
        "button";


    deletePhotoButton.className =
        "edit-action delete-photo-button";


    deletePhotoButton.textContent =
        "Delete Photo";


    deletePhotoButton.addEventListener(
        "click",
        async () => {

            await deleteDogPhoto(
                dogDocument.id,
                dog.photoPath || "",
                avatar
            );

        }
    );


    /* DELETE DOG */

    const deleteDogButton =
        document.createElement(
            "button"
        );


    deleteDogButton.type =
        "button";


    deleteDogButton.className =
        "edit-action delete-dog-button";


    deleteDogButton.textContent =
        "Delete Dog";


    deleteDogButton.addEventListener(
        "click",
        async () => {

            await deleteDogProfile(
                dogDocument.id,
                dog.photoPath || ""
            );

        }
    );


    editPanel.appendChild(
        fileInput
    );


    editPanel.appendChild(
        uploadButton
    );


    editPanel.appendChild(
        deletePhotoButton
    );


    editPanel.appendChild(
        deleteDogButton
    );


    /* EDIT TOGGLE */

    editButton.addEventListener(
        "click",
        () => {

            const open =
                editPanel.style.display
                    === "block";


            if (open) {

                editPanel.style.display =
                    "none";


                editButton.textContent =
                    "Edit";

            }
            else {

                editPanel.style.display =
                    "block";


                editButton.textContent =
                    "Close";

            }

        }
    );


    card.appendChild(
        avatar
    );


    card.appendChild(
        name
    );


    card.appendChild(
        number
    );


    card.appendChild(
        editButton
    );


    card.appendChild(
        editPanel
    );


    dogList.appendChild(
        card
    );

}


/* =========================================
   CHANGE AVATAR
   ========================================= */

async function changeAvatar(
    dogId,
    value,
    mainAvatar,
    grid
) {

    try {

        const dogRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "dogs",
                dogId
            );


        await updateDoc(
            dogRef,
            {
                avatar:
                    value,

                photoUrl:
                    "",

                photoPath:
                    ""
            }
        );


        /*
         * Update only the existing card.
         *
         * The Edit panel therefore stays open.
         */

        mainAvatar.innerHTML =
            "";


        mainAvatar.textContent =
            value;


        grid
            .querySelectorAll(
                ".avatar-option"
            )
            .forEach(
                option => {

                    option.classList.remove(
                        "selected"
                    );


                    if (
                        option.textContent
                            === value
                    ) {

                        option.classList.add(
                            "selected"
                        );

                    }

                }
            );


        showStatus(
            "Avatar changed.",
            false
        );

    }
    catch (error) {

        console.error(
            "Avatar error:",
            error
        );


        showStatus(
            "The avatar could not be changed.",
            true
        );

    }

}


/* =========================================
   UPLOAD PHOTO
   ========================================= */

async function uploadDogPhoto(
    dogId,
    file,
    mainAvatar
) {

    if (!file) {
        return;
    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        showStatus(
            "Please choose an image.",
            true
        );

        return;

    }


    try {

        const photoPath =
            "users/" +
            currentUser.uid +
            "/dogs/" +
            dogId +
            "/profile";


        const storageReference =
            ref(
                storage,
                photoPath
            );


        await uploadBytes(
            storageReference,
            file,
            {
                contentType:
                    file.type
            }
        );


        const photoUrl =
            await getDownloadURL(
                storageReference
            );


        const dogRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "dogs",
                dogId
            );


        await updateDoc(
            dogRef,
            {
                photoUrl:
                    photoUrl,

                photoPath:
                    photoPath
            }
        );


        /*
         * Update the visible image directly.
         */

        mainAvatar.innerHTML =
            "";


        const image =
            document.createElement(
                "img"
            );


        image.src =
            photoUrl;


        image.alt =
            "";


        mainAvatar.appendChild(
            image
        );


        showStatus(
            "Photo uploaded successfully.",
            false
        );

    }
    catch (error) {

        console.error(
            "PHOTO UPLOAD ERROR:",
            error
        );


        console.error(
            "Firebase error code:",
            error.code
        );


        if (
            error.code ===
            "storage/unauthorized"
        ) {

            showStatus(
                "Firebase Storage permission is blocking the photo upload.",
                true
            );

        }
        else {

            showStatus(
                "The photo could not be uploaded.",
                true
            );

        }

    }

}


/* =========================================
   DELETE PHOTO
   ========================================= */

async function deleteDogPhoto(
    dogId,
    photoPath,
    mainAvatar
) {

    try {

        if (photoPath) {

            try {

                await deleteObject(
                    ref(
                        storage,
                        photoPath
                    )
                );

            }
            catch (error) {

                console.log(
                    "Storage image already missing.",
                    error
                );

            }

        }


        const dogRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "dogs",
                dogId
            );


        await updateDoc(
            dogRef,
            {
                photoUrl:
                    "",

                photoPath:
                    ""
            }
        );


        mainAvatar.innerHTML =
            "";


        mainAvatar.textContent =
            "🐶";


        showStatus(
            "Photo deleted.",
            false
        );

    }
    catch (error) {

        console.error(
            "Delete photo error:",
            error
        );


        showStatus(
            "The photo could not be deleted.",
            true
        );

    }

}


/* =========================================
   DELETE DOG
   ========================================= */

async function deleteDogProfile(
    dogId,
    photoPath
) {

    if (!currentUser) {
        return;
    }


    const confirmed =
        window.confirm(
            "Are you sure you want to delete this dog?"
        );


    if (!confirmed) {
        return;
    }


    try {

        if (photoPath) {

            try {

                await deleteObject(
                    ref(
                        storage,
                        photoPath
                    )
                );

            }
            catch (error) {

                console.log(
                    "Storage image already missing.",
                    error
                );

            }

        }


        const dogRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "dogs",
                dogId
            );


        await deleteDoc(
            dogRef
        );


        await loadDogs();


        showStatus(
            "Dog deleted.",
            false
        );

    }
    catch (error) {

        console.error(
            "Delete Dog error:",
            error
        );


        showStatus(
            "The dog could not be deleted.",
            true
        );

    }

}


/* =========================================
   AUTH
   ========================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        /*
         * Only redirect when Firebase has
         * actually confirmed there is no user.
         */

        if (!user) {

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        /* ADMIN */

        try {

            const userSnapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (
                userSnapshot.exists()
                &&
                userSnapshot.data().role
                    === "admin"
            ) {

                adminButton.style.display =
                    "inline-flex";

            }
            else {

                adminButton.style.display =
                    "none";

            }

        }
        catch (error) {

            console.error(
                "Admin check failed:",
                error
            );


            adminButton.style.display =
                "none";

        }


        /* DOGS */

        try {

            await loadDogs();

        }
        catch (error) {

            console.error(
                "Load Dogs error:",
                error
            );


            showStatus(
                "Could not load your dogs.",
                true
            );

        }

    }
);


/* =========================================
   SIGN OUT
   ========================================= */

signOutButton.addEventListener(
    "click",
    async () => {

        signOutButton.disabled =
            true;


        try {

            await signOut(
                auth
            );


            window.location.replace(
                "index.html"
            );

        }
        catch (error) {

            console.error(
                "Sign Out error:",
                error
            );


            signOutButton.disabled =
                false;


            showStatus(
                "Sign out failed.",
                true
            );

        }

    }
);


</script>
